name: Build Survey App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory
      run: |
        mkdir -p www
        find . -maxdepth 1 -iname "index.html" -exec cp {} www/index.html \;
        [ -f manifest.json ] && cp manifest.json www/ || true
        ls -la www/

    - name: Install Dependencies & Init Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
        npx cap init "Land meter" "com.ashwini.landmeter" --web-dir www
        npx cap add android

    - name: Generate App Icons
      run: |
        if [ -f "icon.png" ]; then
          mkdir -p assets
          cp icon.png assets/logo.png
          npx capacitor-assets generate --android --assetPath assets
        fi

    - name: Add Android Permissions
      run: |
        sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

    - name: Sync Capacitor
      run: |
        npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Clean APK
      uses: actions/upload-artifact@v4
      with:
        name: Land-Meter-Clean-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
